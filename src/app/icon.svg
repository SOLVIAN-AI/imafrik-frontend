<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Marque IMAFRIK, en couleurs fixes : une icône d'onglet ne lit pas
       les variables CSS de l'application. Teintes reprises de
       --color-accent-500 / -300 et du fond sombre de l'interface. -->
  <defs>
    <linearGradient id="m" x1="4" y1="20" x2="20" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fceb0"/>
      <stop offset="1" stop-color="#a8efe1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="6" fill="#0c0e12"/>
  <path d="M6.5 17.5 17.5 6.5" stroke="url(#m)" stroke-width="2.25" stroke-linecap="round"/>
  <circle cx="8.75" cy="8.75" r="1.75" fill="url(#m)"/>
</svg>

# Contrôles de sécurité du frontend IMAFRIK.
#
# Trois contrôles indépendants, chacun dans son job pour que le journal
# dise *lequel* a échoué :
#
# - **Secrets** (gitleaks) : aucune clé, aucun jeton ne doit entrer dans
#   l'historique. Le dépôt est public : un secret poussé est un secret
#   publié, qu'il faut révoquer, pas seulement effacer. L'analyse porte
#   sur tout l'historique de la branche, pas seulement sur le dernier
#   commit. La CLI est lancée depuis son image officielle, version figée :
#   l'action GitHub de gitleaks exige une licence pour un compte
#   d'organisation.
# - **Dépendances** (npm audit) : les vulnérabilités connues des paquets
#   livrés en production (`--omit=dev`), à partir de la gravité haute.
#   Les dépendances de développement (Playwright, ESLint) ne partent pas
#   chez l'utilisateur ; Dependabot les suit de toute façon.
# - **Code** (CodeQL) : analyse statique JavaScript/TypeScript, requêtes
#   `security-extended`. Gratuite tant que le dépôt est public ; au
#   passage en privé, elle exige GitHub Advanced Security (Code Security),
#   sans quoi ce job échouera et devra être retiré ou la licence prise.
#
# Lancés sur chaque pull request, sur `main`, et chaque lundi : une
# vulnérabilité publiée après la fusion doit se voir sans attendre le
# prochain changement de code.

name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lundi 05:17 UTC, avant la journée de travail à Lomé.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : un secret ajouté puis retiré reste lisible
          # dans un commit antérieur.
          fetch-depth: 0

      - name: Rechercher des secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --exit-code 1

  dependances:
    name: Dépendances (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Le verrou suffit : `npm audit` ne lit que l'arbre résolu, sans
      # rien installer.
      - name: Vulnérabilités des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: Code (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publication des alertes dans l'onglet Security du dépôt.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

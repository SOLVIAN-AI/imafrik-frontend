# Intégration continue du frontend IMAFRIK.
#
# Contrôles ordonnés du plus rapide au plus lent : rien ne sert de
# compiler si le formatage est déjà en cause. Chacun échoue séparément,
# pour que le journal dise *quoi* corriger sans avoir à le lire en entier.
#
# Le contrat d'API (`api:check`) se compare au schéma OpenAPI publié par
# le dépôt backend, qui est privé : il est extrait avec un jeton en
# lecture seule, `BACKEND_READ_TOKEN` (jeton « fine-grained » limité au
# dépôt imafrik-backend, permission Contents: read). Sans ce secret, la
# vérification est signalée comme manquante plutôt que réussie en
# silence — les schémas zod restent de toute façon vérifiés à la
# compilation contre les types générés.
#
# Les parcours de bout en bout (job `e2e`) tournent ici contre le mode
# démonstration : une compilation de production sans Supabase ni API,
# servie par `next start`. Ceux qui demandent un environnement complet
# (Supabase, API, Orthanc) tournent sur la préproduction.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push qui en suit un autre annule la vérification devenue inutile :
# c'est le dernier état de la branche qui compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    # Exposé au niveau du job : la condition d'une étape ne voit pas les
    # variables déclarées sur l'étape elle-même.
    env:
      BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
    defaults:
      run:
        working-directory: frontend

    steps:
      # Le dépôt est extrait dans `frontend/` pour que le chemin relatif
      # `../backend` de `api:check` fonctionne ici comme en local.
      - uses: actions/checkout@v4
        with:
          path: frontend

      - name: Extraire le contrat du backend
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: SOLVIAN-AI/imafrik-backend
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          path: backend
          sparse-checkout: services/api/openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` plutôt que `npm install` : il installe exactement ce que
      # décrit le verrou et échoue si celui-ci n'est pas à jour.
      - name: Installer les dépendances
        run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Contrat d'API
        run: |
          if [ ! -f ../backend/services/api/openapi.json ]; then
            echo "::warning title=Contrat d'API non vérifié::Secret BACKEND_READ_TOKEN absent."
            exit 0
          fi
          npm run api:check

      - name: Compilation
        run: npm run build

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mode démonstration : ces variables vides font servir le jeu de
    # démonstration intégré, à la compilation comme au démarrage.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: ""
      NEXT_PUBLIC_VIEWER_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Compiler en mode démonstration
        run: npm run build

      # La compilation est faite : le serveur de test démarre sans la refaire.
      - name: Parcours de bout en bout
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Publier le rapport
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14

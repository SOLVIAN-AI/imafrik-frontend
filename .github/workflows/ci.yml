# Intégration continue du frontend IMAFRIK.
#
# Contrôles ordonnés du plus rapide au plus lent : rien ne sert de
# compiler si le formatage est déjà en cause. Chacun échoue séparément,
# pour que le journal dise *quoi* corriger sans avoir à le lire en entier.
#
# Le contrat d'API (`api:check`) se compare au schéma OpenAPI publié par
# le dépôt backend, qui est privé : il est extrait avec un jeton en
# lecture seule, `BACKEND_READ_TOKEN` (jeton « fine-grained » limité au
# dépôt imafrik-backend, permission Contents: read). Sans ce secret, la
# vérification est signalée comme manquante plutôt que réussie en
# silence — les schémas zod restent de toute façon vérifiés à la
# compilation contre les types générés.
#
# Les parcours de bout en bout (job `e2e`) tournent ici contre le mode
# démonstration : une compilation de production sans Supabase ni API,
# servie par `next start`.
#
# Les parcours réels (job `reel`) traversent au contraire le vrai
# Supabase et la vraie API, démarrés sur l'exécuteur : Supabase local
# avec les migrations du backend, API depuis son image de production.
# Ils extraient le backend avec le même jeton `BACKEND_READ_TOKEN`, et
# sont signalés comme non lancés sans lui. Seul Orthanc manque à la pile :
# le viewer reste vérifié sur la préproduction.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancement à la main, sur n'importe quelle branche (Actions → CI → Run
  # workflow, ou `gh workflow run ci.yml --ref <branche>`) : utile pour
  # vérifier une branche avant d'ouvrir sa pull request.
  workflow_dispatch:

# Un push qui en suit un autre annule la vérification devenue inutile :
# c'est le dernier état de la branche qui compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    # Exposé au niveau du job : la condition d'une étape ne voit pas les
    # variables déclarées sur l'étape elle-même.
    env:
      BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
    defaults:
      run:
        working-directory: frontend

    steps:
      # Le dépôt est extrait dans `frontend/` pour que le chemin relatif
      # `../backend` de `api:check` fonctionne ici comme en local.
      - uses: actions/checkout@v7
        with:
          path: frontend

      # Une fonctionnalité qui touche aux deux dépôts porte le même nom de
      # branche des deux côtés : son contrat est alors celui de la branche
      # homonyme du backend, pas celui de `main`, qui ne l'a pas encore.
      # Sans branche homonyme, c'est `main` (ou la branche par défaut).
      - name: Choisir la version du contrat
        id: backend-ref
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${BACKEND_READ_TOKEN}@github.com/SOLVIAN-AI/imafrik-backend.git" \
            "refs/heads/${BRANCH}" > /dev/null; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extraire le contrat du backend
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: SOLVIAN-AI/imafrik-backend
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend
          sparse-checkout: services/api/openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` plutôt que `npm install` : il installe exactement ce que
      # décrit le verrou et échoue si celui-ci n'est pas à jour.
      - name: Installer les dépendances
        run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Contrat d'API
        run: |
          if [ ! -f ../backend/services/api/openapi.json ]; then
            echo "::warning title=Contrat d'API non vérifié::Secret BACKEND_READ_TOKEN absent."
            exit 0
          fi
          npm run api:check

      - name: Compilation
        run: npm run build

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mode démonstration : ces variables vides font servir le jeu de
    # démonstration intégré, à la compilation comme au démarrage.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: ""
      NEXT_PUBLIC_VIEWER_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Compiler en mode démonstration
        run: npm run build

      # La compilation est faite : le serveur de test démarre sans la refaire.
      - name: Parcours de bout en bout
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Publier le rapport
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  reel:
    name: Parcours réels (Supabase et API)
    runs-on: ubuntu-latest
    # Quinze minutes attendues ; la marge couvre un tirage d'images lent.
    timeout-minutes: 25
    env:
      BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}

    steps:
      - name: Jeton de lecture du backend
        if: ${{ env.BACKEND_READ_TOKEN == '' }}
        run: |
          echo "::warning title=Parcours réels non lancés::Secret BACKEND_READ_TOKEN absent : le dépôt backend, privé, ne peut pas être extrait."

      - uses: actions/checkout@v7
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        with:
          path: frontend

      # Même règle que pour le contrat : la branche homonyme du backend si
      # elle existe, `main` sinon.
      - name: Choisir la version du backend
        id: backend-ref
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            "https://x-access-token:${BACKEND_READ_TOKEN}@github.com/SOLVIAN-AI/imafrik-backend.git" \
            "refs/heads/${BRANCH}" > /dev/null; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extraire le backend
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: SOLVIAN-AI/imafrik-backend
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend

      - name: Parcours réels
        if: ${{ env.BACKEND_READ_TOKEN != '' }}
        uses: ./frontend/.github/actions/parcours-reels
